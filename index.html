<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>แพทริเซียคลินิกเวชกรรมเพชรบุรี-บ้านแหลม</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <section class="login-screen" id="loginScreen" aria-label="เข้าสู่ระบบ แพทริเซียคลินิกเวชกรรมเพชรบุรี-บ้านแหลม">
      <form class="login-card" id="loginForm">
        <div class="brand login-brand">
          <div class="brand-mark logo-mark" aria-hidden="true">
            <img src="assets/logo.jpg" alt="">
          </div>
          <div>
            <strong>แพทริเซียคลินิกเวชกรรมเพชรบุรี-บ้านแหลม</strong>
            <span>Clinic Management System</span>
          </div>
        </div>
        <div>
          <p class="eyebrow">ระบบจัดการข้อมูลคลินิก</p>
          <h1>เข้าสู่ระบบ</h1>
        </div>
        <div class="field full">
          <label for="username">ยูสเซอร์</label>
          <input id="username" name="username" autocomplete="username" required>
        </div>
        <div class="field full">
          <label for="password">พาสเวิร์ด</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <p class="login-error" id="loginError" role="alert"></p>
        <button type="submit">เข้าสู่ระบบ</button>
      </form>
    </section>

    <aside class="sidebar" aria-label="เมนูหลัก">
      <div class="brand">
        <div class="brand-mark logo-mark" aria-hidden="true">
          <img src="assets/logo.jpg" alt="">
        </div>
        <div>
          <strong>แพทริเซียคลินิกเวชกรรมเพชรบุรี-บ้านแหลม</strong>
          <span>เพชรบุรี-บ้านแหลม</span>
        </div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="clinic-card">
        <span>วันนี้</span>
        <strong id="todayLabel">-</strong>
        <small>สาขาสุขภาพผิวและเวชกรรมทั่วไป</small>
      </div>
    </aside>

    <main class="app">
      <header class="topbar">
        <div>
          <p class="eyebrow" id="sectionEyebrow">ภาพรวมการให้บริการ</p>
          <h1 id="sectionTitle">แดชบอร์ด</h1>
        </div>
        <div class="top-actions">
          <label class="search">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.35-4.35M10.8 18a7.2 7.2 0 1 1 0-14.4 7.2 7.2 0 0 1 0 14.4Z"/></svg>
            <input id="globalSearch" type="search" placeholder="ค้นหาคนไข้, นัดหมาย, ใบเสร็จ">
          </label>
          <button class="icon-button" id="seedButton" title="คืนค่าข้อมูลตัวอย่าง" aria-label="คืนค่าข้อมูลตัวอย่าง">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 0 1 15.1-6.6M21 12a9 9 0 0 1-15.1 6.6M18 3v5h-5M6 21v-5h5"/></svg>
          </button>
          <button class="icon-button secondary" id="logoutButton" title="ออกจากระบบ" aria-label="ออกจากระบบ">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 17l5-5-5-5M15 12H3M21 3v18h-6"/></svg>
          </button>
        </div>
      </header>

      <section class="content" id="content" aria-live="polite"></section>
    </main>

    <dialog id="modal">
      <form method="dialog" class="modal">
        <div class="modal-head">
          <h2 id="modalTitle">เพิ่มข้อมูล</h2>
          <button class="icon-button modal-close" value="cancel" aria-label="ปิด" formnovalidate>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </div>
        <div id="modalFields" class="form-grid"></div>
        <menu>
          <button value="cancel" class="secondary" formnovalidate>ยกเลิก</button>
          <button id="modalSave" value="default">บันทึก</button>
        </menu>
      </form>
    </dialog>

    <template id="emptyState">
      <div class="empty">
        <svg viewBox="0 0 180 120" aria-hidden="true">
          <rect x="24" y="20" width="132" height="80" rx="8" fill="#e8f3f1"/>
          <path d="M50 48h80M50 64h50M50 80h64" stroke="#2f7d77" stroke-width="6" stroke-linecap="round"/>
          <circle cx="132" cy="76" r="18" fill="#f5b95f"/>
          <path d="m124 76 6 6 12-14" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <strong>ไม่พบข้อมูลที่ตรงกับการค้นหา</strong>
        <span>ลองเปลี่ยนคำค้นหรือเพิ่มรายการใหม่</span>
      </div>
    </template>

    <script src="app.js"></script>
  </body>
</html>
