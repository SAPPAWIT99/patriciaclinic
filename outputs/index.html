<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>แพทริเซียคลินิกเวชกรรมเพชรบุรี-บ้านแหลม</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <section class="login-screen" id="loginScreen" aria-label="เข้าสู่ระบบ แพทริเซียคลินิกเวชกรรมเพชรบุรี-บ้านแหลม">
      <form class="login-card" id="loginForm">
        <div class="brand login-brand">
          <div class="brand-mark logo-mark" aria-hidden="true">
            <img src="assets/logo.jpg" alt="">
          </div>
          <div>
            <strong>Patricia Clinic</strong>
            <span>ADMINISTRATION PORTAL</span>
          </div>
        </div>
        <div>
          <p class="eyebrow">ADMINISTRATION PORTAL</p>
          <h1>ยินดีต้อนรับ</h1>
          <p class="login-subtitle">เข้าสู่ระบบเพื่อจัดการคลินิกของคุณ</p>
        </div>
        <div class="field full">
          <label for="username">อีเมลผู้ใช้งาน</label>
          <input id="username" name="username" autocomplete="username" value="patriciaclinic" required>
        </div>
        <div class="field full">
          <label for="password">รหัสผ่าน</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <p class="login-error" id="loginError" role="alert"></p>
        <button type="submit">เข้าสู่ระบบ <span aria-hidden="true">→</span></button>
      </form>
    </section>

    <aside class="sidebar" aria-label="เมนูหลัก">
      <div class="brand">
        <div class="brand-mark logo-mark" aria-hidden="true">
          <img src="assets/logo.jpg" alt="">
        </div>
        <div>
          <strong>Patricia Clinic</strong>
          <span>บ้านแหลม</span>
        </div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-footer" aria-label="สถานะระบบ">
        <button class="mode-toggle" type="button" aria-label="Light Mode">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v2M12 19v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M3 12h2M19 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41M12 8a4 4 0 1 1 0 8 4 4 0 0 1 0-8Z"/></svg>
          <span>Light Mode</span>
        </button>
        <div class="sidebar-user">
          <span class="user-avatar">A</span>
          <div>
            <strong>patriciaclinic</strong>
            <small>Admin</small>
          </div>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 17l5-5-5-5M15 12H3M21 3v18h-6"/></svg>
        </div>
        <div class="connection-status">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.55a11 11 0 0 1 14 0M8.5 16a6 6 0 0 1 7 0M12 20h.01"/></svg>
          <span>CONNECTED</span>
        </div>
      </div>
    </aside>

    <main class="app">
      <header class="topbar">
        <div>
          <p class="eyebrow" id="sectionEyebrow">ภาพรวมการให้บริการ</p>
          <h1 id="sectionTitle">แดชบอร์ด</h1>
        </div>
        <div class="top-actions">
          <label class="search">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.35-4.35M10.8 18a7.2 7.2 0 1 1 0-14.4 7.2 7.2 0 0 1 0 14.4Z"/></svg>
            <input id="globalSearch" type="search" placeholder="ค้นหาคนไข้, นัดหมาย, ใบเสร็จ">
          </label>
          <button class="icon-button secondary" id="logoutButton" title="ออกจากระบบ" aria-label="ออกจากระบบ">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 17l5-5-5-5M15 12H3M21 3v18h-6"/></svg>
          </button>
        </div>
      </header>

      <section class="content" id="content" aria-live="polite"></section>
    </main>

    <dialog id="modal">
      <form method="dialog" class="modal">
        <div class="modal-head">
          <h2 id="modalTitle">เพิ่มข้อมูล</h2>
          <button class="icon-button modal-close" value="cancel" aria-label="ปิด" formnovalidate>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </div>
        <div id="modalFields" class="form-grid"></div>
        <menu>
          <button value="cancel" class="secondary" formnovalidate>ยกเลิก</button>
          <button id="modalSave" value="default">บันทึก</button>
        </menu>
      </form>
    </dialog>

    <template id="emptyState">
      <div class="empty">
        <svg viewBox="0 0 180 120" aria-hidden="true">
          <rect x="24" y="20" width="132" height="80" rx="8" fill="#e8f3f1"/>
          <path d="M50 48h80M50 64h50M50 80h64" stroke="#2f7d77" stroke-width="6" stroke-linecap="round"/>
          <circle cx="132" cy="76" r="18" fill="#f5b95f"/>
          <path d="m124 76 6 6 12-14" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <strong>ไม่พบข้อมูลที่ตรงกับการค้นหา</strong>
        <span>ลองเปลี่ยนคำค้นหรือเพิ่มรายการใหม่</span>
      </div>
    </template>

    <script src="excel-import-2026-08.js"></script>
    <script src="app.js"></script>
  </body>
</html>
